name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s script/tests
      - run: bash -n script/install.sh script/remote_install.sh script/setup_https.sh script/s2l.sh
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python3 script/collect_frontend_licenses.py
      - run: git diff --exit-code -- web/dist
      - run: go build -o bin/s2l ./cmd/s2l
