name: Documentation screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - web/src/**
      - web/package-lock.json
      - script/test_ui.mjs
      - script/ui_fixture.py
      - .github/workflows/showcase.yml
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Install fonts for multilingual screenshots
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\tpriority:1\n%s\n' 'https://mirrors.mit.edu/ubuntu' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-cjk
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: node script/test_ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: tmp/showcase-*.png
          if-no-files-found: error
